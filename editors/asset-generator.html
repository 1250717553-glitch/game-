<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修仙录 - 高质量水墨素材生成器</title>
<style>
body { font-family: 'KaiTi', serif; background: #1a1a1a; color: #f5f0e1; padding: 20px; }
h1 { font-family: 'STXingkai', serif; color: #b8860b; text-align: center; letter-spacing: 4px; }
.desc { text-align: center; color: #888; margin-bottom: 20px; }
.controls { text-align: center; margin-bottom: 20px; }
button { padding: 10px 25px; margin: 5px; background: #4a6741; border: 1px solid #5a7751; color: white; font-family: 'KaiTi', serif; font-size: 15px; cursor: pointer; border-radius: 4px; }
button:hover { background: #5a7751; }
.category { margin-bottom: 25px; background: rgba(40,40,40,0.8); padding: 15px; border-radius: 8px; border-left: 4px solid #b8860b; }
.category h2 { color: #b8860b; margin-bottom: 12px; font-size: 18px; }
.grid { display: flex; flex-wrap: wrap; gap: 15px; }
.item { text-align: center; background: #2a2a2a; padding: 10px; border-radius: 6px; border: 1px solid #444; }
.item canvas { display: block; margin: 0 auto 8px; background: #f5f0e1; border: 1px solid #555; border-radius: 4px; }
.item .name { font-size: 13px; color: #ccc; }
.item .dl { display: inline-block; margin-top: 5px; padding: 3px 12px; background: #3a6b8c; color: white; font-size: 11px; border-radius: 3px; cursor: pointer; text-decoration: none; }
.progress { width: 80%; margin: 15px auto; height: 24px; background: #333; border-radius: 12px; overflow: hidden; display: none; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #4a6741, #b8860b); width: 0%; transition: width 0.3s; }
.progress-text { text-align: center; color: #888; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>高质量水墨素材生成器</h1>
<p class="desc">256×256 精细水墨风素材，带渐变、阴影、纹理、晕染效果</p>
<div class="controls">
    <button onclick="generateAll()">🎨 一键生成全部素材</button>
    <button onclick="downloadAll()">📦 下载全部PNG</button>
</div>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="progress-text" id="progressText"></div>
<div id="container"></div>

<script>
const SIZE = 256;
const generated = {};

// 水墨颜色
const C = {
    paper: '#f5f0e1', paperDark: '#e8e0d0',
    ink: '#2c2c2c', inkDark: '#1a1a1a', inkMid: '#5a5a5a', inkLight: '#8b8680',
    cinnabar: '#c44536', cinnabarDark: '#8b2020',
    ochre: '#b8860b', ochreLight: '#c9a84c',
    green: '#4a6741', greenLight: '#6b8c5a', greenDark: '#2d4a2a',
    blue: '#3a6b8c', blueLight: '#5a8bac',
    earth: '#8b5a2b', earthLight: '#a67c4a', earthDark: '#5a3a1b',
    white: '#f0ebe0', snow: '#e8eef5'
};

// 宣纸底色
function paper(ctx) {
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 纸纹
    for (let i = 0; i < 40; i++) {
        ctx.fillStyle = `rgba(139,134,128,${Math.random()*0.05})`;
        ctx.beginPath();
        ctx.arc(Math.random()*SIZE, Math.random()*SIZE, Math.random()*40+15, 0, Math.PI*2);
        ctx.fill();
    }
}

// 晕染
function wash(ctx, x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color + Math.floor(alpha*255).toString(16).padStart(2,'0'));
    g.addColorStop(1, color + '00');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
}

// ===== 地形 =====

function genGrass(ctx) {
    paper(ctx);
    // 底色渐变
    const g = ctx.createLinearGradient(0, 0, SIZE, SIZE);
    g.addColorStop(0, '#7a9c5a');
    g.addColorStop(0.5, '#6b8c5a');
    g.addColorStop(1, '#5a7c4a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 晕染
    wash(ctx, 60, 60, 80, '#4a6741', 0.3);
    wash(ctx, 180, 150, 70, '#8bac6a', 0.25);
    wash(ctx, 120, 200, 60, '#3a5731', 0.2);
    // 草叶
    ctx.strokeStyle = '#2d4a2a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 80; i++) {
        const x = Math.random()*SIZE, y = Math.random()*SIZE;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x+(Math.random()-0.5)*8, y-8, x+(Math.random()-0.5)*6, y-12-Math.random()*8);
        ctx.stroke();
    }
    // 草丛
    for (let i = 0; i < 8; i++) {
        const x = Math.random()*SIZE, y = Math.random()*SIZE;
        ctx.fillStyle = `rgba(45,74,42,${0.3+Math.random()*0.2})`;
        ctx.beginPath();
        ctx.ellipse(x, y, 12+Math.random()*8, 6+Math.random()*4, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
    }
}

function genForest(ctx) {
    paper(ctx);
    // 深绿底色
    const g = ctx.createLinearGradient(0, 0, 0, SIZE);
    g.addColorStop(0, '#3a5731');
    g.addColorStop(1, '#1a3711');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 远景树
    for (let i = 0; i < 15; i++) {
        const x = Math.random()*SIZE, y = Math.random()*SIZE*0.6;
        wash(ctx, x, y, 30+Math.random()*20, '#1a3711', 0.4);
    }
    // 近景树
    for (let i = 0; i < 8; i++) {
        const x = 20+Math.random()*(SIZE-40), y = 40+Math.random()*(SIZE-60);
        // 树干
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(x-4, y, 8, 30+Math.random()*20);
        // 树冠（多层）
        wash(ctx, x, y-10, 25+Math.random()*10, '#2d4a2a', 0.7);
        wash(ctx, x-8, y-5, 18, '#3a5731', 0.6);
        wash(ctx, x+8, y-8, 16, '#4a6741', 0.5);
    }
    // 雾气
    wash(ctx, 128, 80, 100, '#8b9c8b', 0.15);
    wash(ctx, 60, 180, 80, '#8b9c8b', 0.12);
}

function genMountain(ctx) {
    paper(ctx);
    // 天空渐变
    const sky = ctx.createLinearGradient(0, 0, 0, SIZE);
    sky.addColorStop(0, '#d5d0c0');
    sky.addColorStop(0.4, '#c5c0b0');
    sky.addColorStop(1, '#a5a090');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 远山（淡墨）
    ctx.fillStyle = 'rgba(120,120,120,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, 120);
    ctx.lineTo(40, 70); ctx.lineTo(70, 90); ctx.lineTo(110, 50);
    ctx.lineTo(150, 80); ctx.lineTo(190, 45); ctx.lineTo(230, 75);
    ctx.lineTo(SIZE, 60); ctx.lineTo(SIZE, SIZE); ctx.lineTo(0, SIZE);
    ctx.fill();
    // 中山
    ctx.fillStyle = 'rgba(80,80,80,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, 160);
    ctx.lineTo(30, 110); ctx.lineTo(60, 135); ctx.lineTo(100, 95);
    ctx.lineTo(140, 125); ctx.lineTo(180, 100); ctx.lineTo(220, 130);
    ctx.lineTo(SIZE, 115); ctx.lineTo(SIZE, SIZE); ctx.lineTo(0, SIZE);
    ctx.fill();
    // 近山（浓墨）
    ctx.fillStyle = 'rgba(50,50,50,0.75)';
    ctx.beginPath();
    ctx.moveTo(0, 200);
    ctx.lineTo(25, 155); ctx.lineTo(55, 180); ctx.lineTo(90, 145);
    ctx.lineTo(130, 175); ctx.lineTo(170, 150); ctx.lineTo(210, 178);
    ctx.lineTo(SIZE, 160); ctx.lineTo(SIZE, SIZE); ctx.lineTo(0, SIZE);
    ctx.fill();
    // 雪顶
    ctx.fillStyle = 'rgba(245,240,225,0.8)';
    ctx.beginPath();
    ctx.moveTo(95, 52); ctx.lineTo(110, 50); ctx.lineTo(105, 58);
    ctx.lineTo(100, 55); ctx.lineTo(97, 60); ctx.fill();
    // 云雾
    wash(ctx, 80, 130, 50, '#d5d0c0', 0.4);
    wash(ctx, 170, 150, 45, '#d5d0c0', 0.35);
}

function genWater(ctx) {
    paper(ctx);
    // 水面渐变
    const g = ctx.createLinearGradient(0, 0, 0, SIZE);
    g.addColorStop(0, '#5a8bac');
    g.addColorStop(0.5, '#3a6b8c');
    g.addColorStop(1, '#2a4b6c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 水波纹
    for (let row = 0; row < 12; row++) {
        const y = 15 + row * 20;
        ctx.strokeStyle = `rgba(200,220,240,${0.2+Math.random()*0.2})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 0; x <= SIZE; x += 8) {
            const wave = Math.sin(x * 0.08 + row * 0.7) * 4;
            if (x === 0) ctx.moveTo(x, y + wave);
            else ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
    }
    // 深水区
    wash(ctx, 50, 200, 60, '#1a3b5c', 0.4);
    wash(ctx, 200, 60, 50, '#1a3b5c', 0.3);
    // 反光
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 12; i++) {
        ctx.fillRect(Math.random()*200+20, Math.random()*200+20, 20+Math.random()*15, 1.5);
    }
    // 岸边
    ctx.fillStyle = 'rgba(139,90,43,0.5)';
    ctx.fillRect(0, 0, SIZE, 8);
    ctx.fillRect(0, SIZE-8, SIZE, 8);
}

function genSand(ctx) {
    paper(ctx);
    // 沙地渐变
    const g = ctx.createLinearGradient(0, 0, SIZE, SIZE);
    g.addColorStop(0, '#d9c48a');
    g.addColorStop(0.5, '#c9a84c');
    g.addColorStop(1, '#b8983c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 沙粒
    for (let i = 0; i < 120; i++) {
        ctx.fillStyle = `rgba(${139+Math.random()*40},${90+Math.random()*40},${43+Math.random()*30},${0.2+Math.random()*0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random()*SIZE, Math.random()*SIZE, Math.random()*2+0.5, 0, Math.PI*2);
        ctx.fill();
    }
    // 沙丘纹理
    ctx.strokeStyle = 'rgba(139,90,43,0.35)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 40+i*35);
        ctx.quadraticCurveTo(80, 30+i*35+Math.random()*15, 160, 45+i*35);
        ctx.quadraticCurveTo(200, 50+i*35, SIZE, 38+i*35);
        ctx.stroke();
    }
    // 赭石晕染
    wash(ctx, 180, 180, 60, '#b87020', 0.2);
    wash(ctx, 60, 80, 50, '#a86010', 0.15);
}

function genSnow(ctx) {
    paper(ctx);
    // 雪地渐变
    const g = ctx.createLinearGradient(0, 0, 0, SIZE);
    g.addColorStop(0, '#f0f4f8');
    g.addColorStop(0.5, '#e0e8f0');
    g.addColorStop(1, '#d0d8e8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 雪堆
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(70, 210, 55, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(180, 200, 45, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(130, 225, 40, 15, 0, 0, Math.PI*2); ctx.fill();
    // 阴影
    ctx.fillStyle = 'rgba(150,170,200,0.25)';
    ctx.beginPath();
    ctx.ellipse(75, 218, 45, 12, 0, 0, Math.PI*2); ctx.fill();
    // 雪花
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    for (let i = 0; i < 50; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*SIZE, Math.random()*SIZE, Math.random()*2.5+0.5, 0, Math.PI*2);
        ctx.fill();
    }
    // 枯枝
    ctx.strokeStyle = 'rgba(60,60,60,0.6)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(200, 195); ctx.lineTo(205, 130);
    ctx.moveTo(205, 155); ctx.lineTo(190, 140);
    ctx.moveTo(205, 145); ctx.lineTo(220, 130);
    ctx.stroke();
    // 淡蓝阴影
    wash(ctx, 50, 50, 60, '#a0b8d8', 0.15);
}

// ===== 建筑 =====

function genSect(ctx) {
    paper(ctx);
    // 台阶
    ctx.fillStyle = '#9a8a7a';
    ctx.fillRect(30, 210, 196, 18);
    ctx.fillStyle = '#aa9a8a';
    ctx.fillRect(45, 195, 166, 15);
    ctx.fillStyle = '#baaa9a';
    ctx.fillRect(58, 182, 140, 13);
    // 墙体
    const wallG = ctx.createLinearGradient(0, 100, 0, 182);
    wallG.addColorStop(0, '#d45546');
    wallG.addColorStop(1, '#a43526');
    ctx.fillStyle = wallG;
    ctx.fillRect(58, 100, 140, 82);
    // 墙线
    ctx.strokeStyle = 'rgba(100,30,20,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(58, 100, 140, 82);
    // 门
    const doorG = ctx.createLinearGradient(0, 135, 0, 182);
    doorG.addColorStop(0, '#5a3015');
    doorG.addColorStop(1, '#3a1a05');
    ctx.fillStyle = doorG;
    ctx.fillRect(108, 135, 40, 47);
    ctx.strokeStyle = '#2a1005';
    ctx.lineWidth = 2;
    ctx.strokeRect(108, 135, 40, 47);
    // 门钉
    ctx.fillStyle = '#c9a84c';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
        ctx.beginPath();
        ctx.arc(118+c*20, 145+r*12, 2, 0, Math.PI*2); ctx.fill();
    }
    // 屋顶
    const roofG = ctx.createLinearGradient(0, 40, 0, 100);
    roofG.addColorStop(0, '#4a4a4a');
    roofG.addColorStop(1, '#2a2a2a');
    ctx.fillStyle = roofG;
    ctx.beginPath();
    ctx.moveTo(35, 100);
    ctx.lineTo(128, 38);
    ctx.lineTo(221, 100);
    ctx.lineTo(210, 105);
    ctx.lineTo(128, 48);
    ctx.lineTo(46, 105);
    ctx.fill();
    // 飞檐
    ctx.fillStyle = '#b8860b';
    ctx.beginPath();
    ctx.moveTo(35, 100); ctx.lineTo(25, 88); ctx.lineTo(45, 100); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(221, 100); ctx.lineTo(231, 88); ctx.lineTo(211, 100); ctx.fill();
    // 屋脊兽
    ctx.fillStyle = '#c9a84c';
    ctx.beginPath();
    ctx.arc(128, 42, 5, 0, Math.PI*2); ctx.fill();
    // 牌匾
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(98, 82, 60, 20);
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(98, 82, 60, 20);
    ctx.fillStyle = '#c9a84c';
    ctx.font = 'bold 14px KaiTi';
    ctx.textAlign = 'center';
    ctx.fillText('青云宗', 128, 97);
    // 灯笼
    for (const lx of [75, 181]) {
        const lg = ctx.createRadialGradient(lx, 115, 2, lx, 115, 10);
        lg.addColorStop(0, '#ffaa44');
        lg.addColorStop(1, '#c44536');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.ellipse(lx, 115, 8, 10, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#5a3015';
        ctx.fillRect(lx-4, 104, 8, 3);
        ctx.fillRect(lx-4, 122, 8, 3);
    }
    // 柱子
    ctx.fillStyle = '#8b2020';
    ctx.fillRect(65, 100, 6, 82);
    ctx.fillRect(185, 100, 6, 82);
}

function genHouse(ctx) {
    paper(ctx);
    // 地基
    ctx.fillStyle = '#9a8a7a';
    ctx.fillRect(35, 205, 186, 15);
    // 墙体
    const wallG = ctx.createLinearGradient(0, 95, 0, 205);
    wallG.addColorStop(0, '#e8d5b7');
    wallG.addColorStop(1, '#d8c5a7');
    ctx.fillStyle = wallG;
    ctx.fillRect(45, 95, 166, 110);
    ctx.strokeStyle = 'rgba(100,80,60,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(45, 95, 166, 110);
    // 屋顶
    const roofG = ctx.createLinearGradient(0, 40, 0, 95);
    roofG.addColorStop(0, '#6a6a6a');
    roofG.addColorStop(1, '#4a4a4a');
    ctx.fillStyle = roofG;
    ctx.beginPath();
    ctx.moveTo(30, 95);
    ctx.lineTo(128, 42);
    ctx.lineTo(226, 95);
    ctx.fill();
    // 屋顶纹理
    ctx.strokeStyle = 'rgba(30,30,30,0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(45+i*22, 88);
        ctx.lineTo(128, 48);
        ctx.stroke();
    }
    // 屋脊
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(118, 38, 20, 8);
    // 门
    ctx.fillStyle = '#5a3015';
    ctx.fillRect(108, 145, 40, 60);
    ctx.strokeStyle = '#3a1a05';
    ctx.lineWidth = 2;
    ctx.strokeRect(108, 145, 40, 60);
    // 门把手
    ctx.fillStyle = '#c9a84c';
    ctx.beginPath();
    ctx.arc(122, 175, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(134, 175, 3, 0, Math.PI*2); ctx.fill();
    // 窗户
    for (const wx of [65, 175]) {
        ctx.fillStyle = 'rgba(150,180,200,0.7)';
        ctx.fillRect(wx, 120, 28, 28);
        ctx.strokeStyle = '#5a3015';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx, 120, 28, 28);
        // 窗格
        ctx.beginPath();
        ctx.moveTo(wx+14, 120); ctx.lineTo(wx+14, 148);
        ctx.moveTo(wx, 134); ctx.lineTo(wx+28, 134);
        ctx.stroke();
    }
    // 飞檐
    ctx.fillStyle = '#8b7355';
    ctx.beginPath();
    ctx.moveTo(30, 95); ctx.lineTo(22, 85); ctx.lineTo(38, 95); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(226, 95); ctx.lineTo(234, 85); ctx.lineTo(218, 95); ctx.fill();
}

function genFarm(ctx) {
    paper(ctx);
    // 田地底色
    const g = ctx.createLinearGradient(0, 0, 0, SIZE);
    g.addColorStop(0, '#9b6a3b');
    g.addColorStop(1, '#7b4a1b');
    ctx.fillStyle = g;
    ctx.fillRect(15, 15, 226, 226);
    // 田垄
    ctx.strokeStyle = '#5a3a1b';
    ctx.lineWidth = 3;
    for (let i = 0; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(15, 15+i*45.2);
        ctx.lineTo(241, 15+i*45.2);
        ctx.stroke();
    }
    for (let i = 0; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(15+i*56.5, 15);
        ctx.lineTo(15+i*56.5, 241);
        ctx.stroke();
    }
    // 禾苗
    ctx.strokeStyle = '#4a7c31';
    ctx.lineWidth = 2;
    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 4; col++) {
            const x = 43 + col * 56.5;
            const y = 38 + row * 45.2;
            ctx.beginPath();
            ctx.moveTo(x, y+12); ctx.lineTo(x-5, y);
            ctx.moveTo(x, y+12); ctx.lineTo(x+5, y);
            ctx.moveTo(x, y+12); ctx.lineTo(x, y-4);
            ctx.stroke();
        }
    }
    // 田埂
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(10, 10, 236, 6);
    ctx.fillRect(10, 240, 236, 6);
    ctx.fillRect(10, 10, 6, 236);
    ctx.fillRect(240, 10, 6, 236);
    // 土块纹理
    for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(90,58,27,${0.2+Math.random()*0.2})`;
        ctx.beginPath();
        ctx.arc(25+Math.random()*206, 25+Math.random()*206, Math.random()*3+1, 0, Math.PI*2);
        ctx.fill();
    }
}

function genAltar(ctx) {
    paper(ctx);
    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(128, 225, 90, 18, 0, 0, Math.PI*2); ctx.fill();
    // 底座
    const baseG = ctx.createLinearGradient(0, 195, 0, 225);
    baseG.addColorStop(0, '#9a9a9a');
    baseG.addColorStop(1, '#7a7a7a');
    ctx.fillStyle = baseG;
    ctx.beginPath();
    ctx.ellipse(128, 210, 85, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(43, 192, 170, 18);
    // 中层
    const midG = ctx.createLinearGradient(0, 165, 0, 195);
    midG.addColorStop(0, '#aaaaaa');
    midG.addColorStop(1, '#8a8a8a');
    ctx.fillStyle = midG;
    ctx.beginPath();
    ctx.ellipse(128, 175, 70, 15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(58, 160, 140, 15);
    // 上层台面
    const topG = ctx.createLinearGradient(0, 135, 0, 160);
    topG.addColorStop(0, '#bababa');
    topG.addColorStop(1, '#9a9a9a');
    ctx.fillStyle = topG;
    ctx.beginPath();

    ctx.moveTo(133, 78); ctx.lineTo(138, 78);
    ctx.stroke();
    // 嘴
    ctx.beginPath();
    ctx.moveTo(123, 90); ctx.lineTo(133, 90);
    ctx.stroke();
    // 胡须
    ctx.strokeStyle = 'rgba(90,90,90,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(120, 92); ctx.lineTo(116, 102);
    ctx.moveTo(136, 92); ctx.lineTo(140, 102);
    ctx.moveTo(128, 93); ctx.lineTo(128, 105);
    ctx.stroke();
    // 风化痕迹
    ctx.fillStyle = 'rgba(60,60,60,0.2)';
    for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.arc(80+Math.random()*96, 70+Math.random()*130, Math.random()*4+1, 0, Math.PI*2);
        ctx.fill();
    }
    // 青苔
    ctx.fillStyle = 'rgba(74,103,65,0.35)';
    ctx.beginPath();
    ctx.ellipse(88, 195, 14, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(165, 200, 10, 4, 0, 0, Math.PI*2); ctx.fill();
}

// ===== 交互点 =====

function genInteract(ctx, icon, color, name) {
    paper(ctx);
    // 外圈光晕
    const glow = ctx.createRadialGradient(128, 110, 10, 128, 110, 100);
    glow.addColorStop(0, color + '66');
    glow.addColorStop(1, color + '00');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, SIZE, SIZE);
    // 外圈
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(128, 110, 80, 0, Math.PI*2);
    ctx.stroke();
    // 内圈
    ctx.fillStyle = color + '22';
    ctx.beginPath();
    ctx.arc(128, 110, 68, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 5]);
    ctx.beginPath();
    ctx.arc(128, 110, 68, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 图标
    ctx.font = '48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 128, 105);
    // 名称
    ctx.font = 'bold 22px KaiTi';
    ctx.fillStyle = '#2c2c2c';
    ctx.fillText(name, 128, 195);
    // 四角装饰
    ctx.fillStyle = color;
    [[60,60],[196,60],[60,160],[196,160]].forEach(([x,y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    });
}

function generateAll() {
    const container = document.getElementById('container');
    container.innerHTML = '';
    let total = 0, done = 0;
    ALL_ASSETS.forEach(c => total += c.items.length);

    document.getElementById('progress').style.display = 'block';

    ALL_ASSETS.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        catDiv.innerHTML = `<h2>${cat.cat === 'terrain' ? '🌿 地形' : cat.cat === 'building' ? '🏛 建筑' : cat.cat === 'decoration' ? '🌲 装饰' : '✦ 交互点'} (${cat.items.length}个)</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid';

        cat.items.forEach(item => {
            const canvas = document.createElement('canvas');
            canvas.width = SIZE;
            canvas.height = SIZE;
            const ctx = canvas.getContext('2d');
            item.fn(ctx);
            generated[cat.cat + '/' + item.id] = canvas;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'item';
            itemDiv.appendChild(canvas);
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = item.name;
            itemDiv.appendChild(name);
            const dl = document.createElement('a');
            dl.className = 'dl';
            dl.textContent = '下载';
            dl.href = canvas.toDataURL('image/png');
            dl.download = item.id + '.png';
            itemDiv.appendChild(dl);

            grid.appendChild(itemDiv);

            done++;
            document.getElementById('progressBar').style.width = (done/total*100) + '%';
            document.getElementById('progressText').textContent = `生成中... ${done}/${total}`;
        });

        catDiv.appendChild(grid);
        container.appendChild(catDiv);
    });

    setTimeout(() => {
        document.getElementById('progressText').textContent = `✅ 全部生成完成！共 ${total} 个高质量水墨素材`;
        setTimeout(() => { document.getElementById('progress').style.display = 'none'; }, 3000);
    }, 500);
}

function downloadAll() {
    if (Object.keys(generated).length === 0) {
        alert('请先生成素材！');
        return;
    }
    let count = 0;
    for (const key of Object.keys(generated)) {
        const canvas = generated[key];
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = key.replace('/', '_') + '.png';
        a.click();
        count++;
    }
    alert(`已触发 ${count} 个素材下载！\n\n下载后请按分类放到：\nassets/images/terrain/\nassets/images/buildings/\nassets/images/decorations/\nassets/images/interact/`);
}

// 自动生成
window.onload = generateAll;
